server {
    listen 80;
    listen [::]:80;
    server_name portfolio.bo-design.info;
    access_log /var/log/portfolio/access.log portfolio_anonymized;
    error_log /dev/null;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/portfolio.bo-design.info/acme;
    }
    location / {
        return 301 https://portfolio.bo-design.info$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name portfolio.bo-design.info;
    root /var/www/portfolio.bo-design.info/current;
    index index.html;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/portfolio.bo-design.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portfolio.bo-design.info/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/portfolio/access.log portfolio_anonymized;
    error_log /dev/null;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }
    location ~ /\. {
        deny all;
    }
}
