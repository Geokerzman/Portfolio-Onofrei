map $remote_addr $portfolio_anonymized_ip {
    ~^(?<portfolio_ipv4_prefix>\d+\.\d+\.\d+)\.\d+$ $portfolio_ipv4_prefix.0;
    ~^(?<portfolio_ipv6_prefix>[0-9a-fA-F]+:[0-9a-fA-F]+): $portfolio_ipv6_prefix::;
    default anonymous;
}

log_format portfolio_anonymized '$portfolio_anonymized_ip - [$time_local] '
    '"$request" $status $body_bytes_sent';
